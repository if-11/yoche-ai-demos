<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="有车科技 AI 影视工作流与图片 4K 修复演示">
  <title>有车科技 · AI 创作演示</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f2ea;
      --muted: #aaa89f;
      --line: rgba(255, 255, 255, .14);
      --panel: rgba(255, 255, 255, .055);
      --accent: #d8ff63;
      --bg: #11120f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 8%, rgba(216, 255, 99, .10), transparent 28rem),
        linear-gradient(145deg, #151610, var(--bg) 58%);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(64px, 10vw, 124px) 0 72px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(42px, 7vw, 84px);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: .98;
    }

    .intro {
      max-width: 620px;
      margin: 28px 0 56px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      min-height: 310px;
      padding: 30px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-5px);
      border-color: rgba(216, 255, 99, .55);
      background: rgba(255, 255, 255, .08);
      outline: none;
    }

    .number {
      color: var(--accent);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    h2 {
      max-width: 440px;
      margin: 72px 0 14px;
      font-size: clamp(27px, 3.6vw, 42px);
      font-weight: 550;
      letter-spacing: -.035em;
      line-height: 1.12;
    }

    .card p {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .arrow {
      position: absolute;
      right: 28px;
      bottom: 25px;
      color: var(--accent);
      font-size: 26px;
    }

    footer {
      margin-top: 44px;
      color: #73736c;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 270px; }
      h2 { margin-top: 50px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">YOCHE TECH · AI WORKFLOW</p>
    <h1>让创意流程<br>更清晰、更高效。</h1>
    <p class="intro">面向团队的 AI 创作演示，涵盖影视项目前期工作流与图片 4K 修复。选择一个主题开始浏览。</p>

    <section class="grid" aria-label="演示项目">
      <a class="card" href="./ai-film-preproduction.html">
        <span class="number">01 / WORKFLOW</span>
        <h2>AI 影视项目前期工作流</h2>
        <p>从创意理解到视觉开发，查看 AI 影视项目的前期协作与制作流程。</p>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="card" href="./ai-image-4k-restoration.html">
        <span class="number">02 / RESTORATION</span>
        <h2>AI 图片 4K 修复</h2>
        <p>为新人准备的图像高清修复演示，快速理解工具步骤与质量判断。</p>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <footer>有车科技 · AI 创作演示中心</footer>
  </main>
</body>
</html>
